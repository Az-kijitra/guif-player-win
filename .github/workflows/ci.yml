name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check-and-test:
    name: Build & Test
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Install Frontend Dependencies
        working-directory: app
        run: npm ci

      - name: Audit Frontend Dependencies
        working-directory: app
        run: npm audit --omit=dev

      - name: Documents (links and test names)
        working-directory: app
        run: npm run check:docs

      - name: Frontend Tests (Vitest)
        working-directory: app
        run: npm test

      - name: Type Check (svelte-check)
        working-directory: app
        run: npm run check

      - name: Type Check (tsc)
        working-directory: app
        run: npx tsc --noEmit

      - name: Frontend Build
        working-directory: app
        run: npm run build

      - name: Format Check (rustfmt)
        working-directory: app/src-tauri
        run: cargo fmt --check

      - name: Lint (clippy)
        working-directory: app/src-tauri
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Backend Tests (cargo test)
        working-directory: app/src-tauri
        run: cargo test --locked

  dependencies:
    name: Rust Dependencies
    # The cargo-deny action only runs on Linux. It reads Cargo.lock and compiles nothing;
    # deny.toml limits the check to the Windows target.
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check advisories, licenses and sources (cargo-deny)
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: app/src-tauri/Cargo.toml
          command: check
