[package]
name = "guif-player"
version = "0.2.0"
edition = "2021"
description = "guif-player - Windows Audio Player"
license = "MIT"
repository = "https://github.com/Az-kijitra/guif-player-win"
rust-version = "1.90"

[lib]
name = "guif_player_lib"
path = "src/lib.rs"

[[bin]]
name = "guif-player"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-all", "symphonia-alac", "symphonia-aiff"] }
symphonia = { version = "0.5.4", features = ["all"] }
lofty = "0.25"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
base64 = "0.22"
dirs = "6"
fastrand = "2"
wsola = "0.3"
# Opus through libopus. 0.2.x is the line for Symphonia 0.5; building it needs CMake
symphonia-adapter-libopus = "0.2.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_UI_WindowsAndMessaging"] }
# The same version as Tauri uses, for the media controls
windows = { version = "0.62", features = ["Foundation", "Media", "Storage_Streams", "Win32_Foundation", "Win32_System_WinRT"] }

[dev-dependencies]
tempfile = "3"
