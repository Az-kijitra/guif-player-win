[package]
name = "guif-player"
version = "0.1.1"
edition = "2021"
description = "guif-player - Windows Audio Player"

[lib]
name = "guif_player_lib"
path = "src/lib.rs"

[[bin]]
name = "guif-player"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rodio = { version = "0.20", features = ["symphonia-all", "symphonia-alac", "symphonia-aiff"] }
symphonia = { version = "0.5.4", features = ["all"] }
lofty = "0.21"
rusqlite = { version = "0.32", features = ["bundled"] }
walkdir = "2"
base64 = "0.22"
dirs = "6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
